name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (typing engine + fat-finger simulation)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: truetap-keyboard-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/

      # A public release gives a direct .apk link that opens on a phone without signing in to GitHub.
      - name: Publish latest APK as a release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk truetap-keyboard.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest truetap-keyboard.apk --prerelease --target "$GITHUB_SHA" \
            --title "TrueTap Keyboard (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone, tap truetap-keyboard.apk below, open it, and allow installs from your browser if asked."
