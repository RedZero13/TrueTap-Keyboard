name: Screenshots

# Boots an emulator with Pixel 9 screen geometry, drives the real keyboard with real taps
# (tools/screenshots.sh) and publishes the PNGs as the "screenshots" release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/screenshots.sh

      - uses: actions/upload-artifact@v5
        with:
          name: truetap-screenshots
          path: screenshots/

      - name: Publish screenshots release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd screenshots && zip -q ../truetap-screenshots.zip *.png && cd ..
          gh release delete screenshots --yes --cleanup-tag || true
          gh release create screenshots truetap-screenshots.zip screenshots/*.png --prerelease --target "$GITHUB_SHA" \
            --title "TrueTap Keyboard screenshots" \
            --notes "Native screenshots captured from the real app on an emulator with Pixel 9 screen geometry (1080 x 2424, 420 dpi)."
